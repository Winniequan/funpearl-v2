spring.application.name=funpearl
# server
server.port=8080

# database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/funpearl}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:}
# Access token expiration: 24 hours (in milliseconds)
app.jwt.expiration=86400000
# Refresh token expiration: 7 days (in milliseconds)
app.jwt.refresh-expiration=604800000

# Email verification
# Verification token expiration: 24 hours (in milliseconds)
app.email.verification-expiration=86400000