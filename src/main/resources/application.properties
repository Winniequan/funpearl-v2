spring.application.name=funpearl
# server
server.port=8080

# database
spring.datasource.url=jdbc:postgresql://localhost:5432/funpearl
spring.datasource.username=postgres
spring.datasource.password=yourpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
# secret
app.jwt.secret=funpearlSuperSecretKey2024ForJWT1234567890
# Access token expiration: 24 hours (in milliseconds)
app.jwt.expiration=86400000
# Refresh token expiration: 7 days (in milliseconds)
app.jwt.refresh-expiration=604800000