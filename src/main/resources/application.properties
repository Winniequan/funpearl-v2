spring.application.name=funpearl
# server
server.port=8080

# database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/funpearl}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:}
# Access token expiration: 24 hours (in milliseconds)
app.jwt.expiration=86400000
# Refresh token expiration: 7 days (in milliseconds)
app.jwt.refresh-expiration=604800000

# Email verification
# Verification token expiration: 24 hours (in milliseconds)
app.email.verification-expiration=86400000

# Password Reset
# Token expiration: 1 hour (in milliseconds)
app.password-reset.expiration=3600000

# Account Lockout
# Max failed login attempts before lockout
app.lockout.max-attempts=5
# Lockout duration in minutes
app.lockout.duration-minutes=30

# Rate Limiting
# Max login attempts per IP in time window
app.rate-limit.max-attempts=10
# Time window in minutes
app.rate-limit.window-minutes=15

# CORS (add your frontend URLs here)
# app.cors.allowed-origins=http://localhost:3000,http://localhost:5173